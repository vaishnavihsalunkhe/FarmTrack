name: M0 Regression Checks
on:
  push:
    branches: [m0-finance-regression-tests]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run financial and startup regression tests
        run: node --test tests/*.test.cjs
